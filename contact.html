<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature et Paysages - Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">Nature et Paysages</div>
            <ul class="nav-links">
                <li><a href="index.html">Accueil</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h1>Contactez-nous</h1>
            <p>Une question, une suggestion ou envie de collaborer ? Écrivez-nous.</p>

            <div class="contact-container">
                <div class="contact-image">
                    <img src="https://images.unsplash.com/photo-1483728642387-6c3bdd6c93e5?w=600" alt="Paysage de montagne au coucher du soleil">
                </div>

                <form id="contactForm" class="contact-form">
                    <div class="form-group">
                        <label for="nom">Nom complet</label>
                        <input type="text" id="nom" name="nom" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Adresse email</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form-group">
                        <label for="sujet">Sujet</label>
                        <input type="text" id="sujet" name="sujet" required>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>

                    <button type="submit">Envoyer le message</button>
                    <p id="formMessage" class="form-message"></p>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>2024 Nature et Paysages. Tous droits réservés.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
